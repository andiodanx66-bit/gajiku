/* terapkan tema sebelum render supaya tidak ada kedipan (FOUC) */
(function(){
var k='gaji-theme';
var t;try{t=localStorage.getItem(k)}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
var r=document.documentElement;r.dataset.theme=t;
r.style.background=t==='light'?'#f1f5f9':'#0f172a';

<style>
/* variabel tema (dipakai ulang seluruh app) */

--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ok:#22c55e;--ot:#f59e0b;--off:#475569;--ln:#334155;--lv:#38bdf8;

--had-bg:#166534;--had-bd:#15803d;--had-tx:#dcfce7;
--lv-bg:#1e3a5f;--lv-bd:#2563eb;--lv-tx2:#bfdbfe;
--alp-bg:#7f1d1d;--alp-bd:#dc2626;--alp-tx:#fee2e2;--otx:#fca5a5;
--err-tx:#fca5a5;--err-bd:#7f1d1d;--edt:#1e3a5f;
}
[data-theme="light"]{
--bg:#f1f5f9;--card:#ffffff;--tx:#0f172a;--mu:#64748b;--ok:#16a34a;--ot:#d97706;--off:#cbd5e1;--ln:#e2e8f0;--lv:#0284c7;

--had-bg:#bbf7d0;--had-bd:#22c55e;--had-tx:#14532d;
--lv-bg:#dbeafe;--lv-bd:#3b82f6;--lv-tx2:#1e3a8a;
--alp-bg:#fecaca;--alp-bd:#ef4444;--alp-tx:#7f1d1d;--otx:#dc2626;
--err-tx:#b91c1c;--err-bd:#fecaca;--edt:#dbeafe;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));max-width:520px;margin:auto;transition:background .2s,color .2s}
h1{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;transition:background .2s,color .2s,border-color .2s}
button.p{background:var(--ok);color:var(--on-tx);border:0;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--card);border-radius:12px;padding:10px;grid-column:span 2;transition:background .2s}
.card.w{grid-column:span 4}
.card small{color:var(--mu);display:block;font-size:11px}
.card b{font-size:15px}
.tot{background:var(--tot)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dh{text-align:center;color:var(--mu);font-size:11px;padding:2px}
.d{min-height:58px;background:var(--card);border-radius:8px;padding:4px;font-size:11px;border:1px solid transparent;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--d-tx)}
.d span{font-size:13px;font-weight:600;color:var(--d-tx)}
.d span i{font-size:10px;margin-left:1px}/* checklist hadir di samping tanggal */
.d em{font-style:normal;color:var(--d-tx)}
.d i{font-style:normal;color:var(--d-tx)}
.d i.ot{color:var(--otx)}/* nominal lembur (+xxxx) */

.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;justify-content:center}

/* modal detail tabel */
#dtl{width:min(96vw,520px)}

.dtbl th{background:var(--bg);color:var(--mu);padding:6px 4px;text-align:left;position:sticky;top:0;font-weight:600;white-space:nowrap}
.dtbl td{padding:6px 4px;border-bottom:1px solid var(--ln);vertical-align:middle}

/* kolom nominal & total dilebarkan supaya angka muat satu baris */

.dtbl th:nth-child(8),.dtbl td:nth-child(8){width:120px;min-width:120px}

dialog{background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:16px;width:min(92vw,380px);margin:auto}
dialog::backdrop{background:var(--bd)}
input[type=checkbox]{accent-color:var(--ok)}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:12px}
input[type=number],input[type=email],input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:14px}

/* auth */
#auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#auth-box{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:360px}

/* tombol tema */
.tgl{width:40px;height:40px;padding:0;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

[data-theme="light"] .tgl{box-shadow:0 2px 8px #0002}
/* sync status */
#sync{position:fixed;bottom:env(safe-area-inset-bottom,12px);right:12px;font-size:11px;color:var(--mu);opacity:0;transition:opacity .4s}
#sync.show{opacity:1}
</style></head><body>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SURL='https://fykwrrmcznhearbktdso.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5a3dycm1jem5oZWFyYmt0ZHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDI2MDcsImV4cCI6MjEwNjY3ODYwN30.g8qFRmvNF23x1zgPRQztQ9Nx3QPC65v9fao-5g6Ijog';
const sb=createClient(SURL,SKEY);

/* ── state ── */
const K='gaji-state-v1';
const DB=()=>{const b={};for(let d=1;d<=6;d++)b[d]=d==5?['11:30','13:00']:['12:00','13:00'];return b};
const DBo=()=>{const b={};for(let d=1;d<=6;d++)b[d]=d==5?['17:30','18:30']:['17:00','18:00'];return b};
let S={salary:3500000,hours:8,mult:1.5,hol:[],ot:{},att:{},tm:{},lv:{},paid:{sakit:true,izin:false,cuti:true,alpa:false},dIn:'08:00',dOut:'17:00',brk:DB(),brkOt:DBo(),wdays:[1,2,3,4,5,6],holMap:{}};
let syncTimer=null;

function applyState(data){
  Object.assign(S,data);
  if(S.brk&&S.brk.n){const o=S.brk;S.brk=DB();for(let d=1;d<=6;d++)S.brk[d]=d==5?o.f:o.n}
  for(let d=1;d<=6;d++)if(!S.brk[d])S.brk[d]=DB()[d];
  if(!S.brkOt)S.brkOt=DBo();
  for(let d=1;d<=6;d++)if(!S.brkOt[d]||(!S.brkOt[d][0]&&!S.brkOt[d][1]))S.brkOt[d]=DBo()[d];
  if(!S.wdays)S.wdays=[1,2,3,4,5,6];
  if(!S.holMap)S.holMap={};
  if(S.hol&&S.hol.length){S.hol.forEach(k=>{if(!S.holMap[k])S.holMap[k]='Libur Nasional'});S.hol=[];}
}

try{applyState(JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}

function showSync(msg){
  const el=document.getElementById('sync');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

async function saveRemote(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user)return;
  const{error}=await sb.from('gaji_state').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(!error)showSync('✓ Tersimpan');else showSync('⚠ Gagal sync');
}

const save=()=>{
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  saveRemote();
};

const $=id=>document.getElementById(id);

/* ── TEMA (putih / gelap) ── */
const TK='gaji-theme';
const setTheme=t=>{
document.documentElement.dataset.theme=t;
document.documentElement.style.background=t==='light'?'#f1f5f9':'#0f172a';
try{localStorage.setItem(TK,t)}catch(e){}
$('tmc').setAttribute('content',t==='light'?'#f1f5f9':'#0f172a');
const ic=t==='light'?'☀️':'🌙';
document.querySelectorAll('.tgl').forEach(b=>{
if(b.textContent!==ic){b.textContent=ic;b.setAttribute('aria-label',t==='light'?'Aktifkan tema gelap':'Aktifkan tema terang')}
});
};
document.querySelectorAll('.tgl').forEach(b=>b.onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
setTheme(document.documentElement.dataset.theme);
matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{
let s=null;try{s=localStorage.getItem(TK)}catch(err){}
if(!s)setTheme(e.matches?'light':'dark');
});
const LB={sakit:'Sakit',izin:'Izin',cuti:'Cuti',alpa:'Alpa'};
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const rn=n=>Math.round(n).toLocaleString('id-ID');// angka uang tanpa prefix "Rp" (untuk cell kalender)
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
let cur=new Date();cur.setDate(1);
const isOff=(y,m,d)=>!S.wdays.includes(new Date(y,m,d).getDay())||!!S.holMap[key(y,m,d)];

function calc(){
  const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate();
  let wd=0,hd=0,pl=0,oh=0;const lc={sakit:0,izin:0,cuti:0,alpa:0};
  for(let d=1;d<=n;d++){const k=key(y,m,d);oh+=+S.ot[k]||0;
    if(isOff(y,m,d)){if(S.att[k])hd++;continue;}wd++;
    if(S.att[k])hd++;else if(S.lv[k]){lc[S.lv[k]]=(lc[S.lv[k]]||0)+1;if(S.paid[S.lv[k]])pl++}}
  const perDay=wd?S.salary/wd:0,perHour=perDay/S.hours,otHour=perHour*S.mult;
  return{y,m,n,wd,hd,pd:hd+pl,lc,perDay,perHour,otHour,oh,otPay:oh*otHour};
}
function render(){
  const c=calc();
  $('ttl').textContent=cur.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  $('sum').innerHTML=`
  <div class="card"><small>Hari kerja bulan ini</small><b>${c.wd} hari</b></div>
  <div class="card"><small>Hadir bulan ini</small><b>${c.hd} / ${c.wd} hari</b></div>
  <div class="card"><small>Per hari</small><b>${rp(c.perDay)}</b></div>
  <div class="card"><small>Per jam (${S.hours} jam/hari)</small><b>${rp(c.perHour)}</b></div>
  <div class="card"><small>Lembur per jam (${S.mult}x)</small><b>${rp(c.otHour)}</b></div>
  <div class="card"><small>Lembur (${+c.oh.toFixed(2)} jam)</small><b>${rp(c.otPay)}</b></div>
  <div class="card"><small>Tidak masuk</small><b>Sakit ${c.lc.sakit} · Izin ${c.lc.izin} · Cuti ${c.lc.cuti} · Alpa ${c.lc.alpa}</b></div>
  <div class="card tot"><small>Gaji sementara</small><b>${rp(c.pd*c.perDay+c.otPay)}</b></div>
  `;
  let h=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="dh">${x}</div>`).join('');
  const lead=(new Date(c.y,c.m,1).getDay()+6)%7;
  for(let i=0;i<lead;i++)h+='<div class="d x"></div>';
  const t=new Date();
  for(let d=1;d<=c.n;d++){
    const k=key(c.y,c.m,d),off=isOff(c.y,c.m,d),o=+S.ot[k]||0;
    const tod=t.getFullYear()==c.y&&t.getMonth()==c.m&&t.getDate()==d;
    let mid='<div></div>';
    let cls='';
    if(S.att[k]){mid=`<em style="font-size:9px">${rn(c.perDay)}</em>`;cls='hadir';}
    else if(S.lv[k]){mid=`<u>${LB[S.lv[k]]}</u>`;cls=S.lv[k];}
    else if(off){const holName=S.holMap&&S.holMap[k];mid=`<div style="font-size:10px;line-height:1.2">${holName||'libur'}</div>`;cls='off';}
    h+=`<button class="d ${cls} ${tod?'today':''}" data-d="${d}"><span>${d}${S.att[k]?'<i>✓</i>':''}</span>${mid}`+(o?`<i class="ot" style="font-size:9px">+${rn(o*c.otHour)}</i>`:'')+`</button>`;
  }
  $('cal').innerHTML=h;
}

/* waktu */
const T={ti:'',to:'',sin:'',sout:''};
const setT=(id,v)=>{T[id]=v||'';$(id).textContent=v||'--:--'};
const mn=t=>{const[a,b]=t.split(':');return +a*60+ +b};
function wk(){
  if(!T.ti||!T.to)return null;
  const a=mn(T.ti),b=mn(T.to);
  const day=new Date(sel+'T00:00').getDay();
  const[b1,b2]=S.brk[day]||S.brk[1],bs=mn(b1),be=mn(b2);
  const ok=b>a,w=ok?(b-a-Math.max(0,Math.min(b,be)-Math.max(a,bs)))/60:0;
  // istirahat lembur: dikurangi dari durasi setelah jam kerja normal
  const[ob1,ob2]=S.brkOt[day]||['',''];
  let otBrk=0;
  if(ob1&&ob2){const obs=mn(ob1),obe=mn(ob2);otBrk=Math.max(0,Math.min(b,obe)-Math.max(a+S.hours*60,obs))/60;}
  const ot=Math.max(0,w-S.hours-otBrk);
  return{ok,w,ot,b1,b2,ob1,ob2,otBrk};
}
function onT(){
  const k=wk();if(!k){$('inf').textContent='';return}
  let msg=k.ok?`Jam kerja ${+k.w.toFixed(2)} jam · Lembur ${+k.ot.toFixed(2)} jam (istirahat ${k.b1}–${k.b2} dikurangi`:'Jam pulang harus setelah jam masuk';
  if(k.ok&&k.ob1&&k.ob2)msg+=`, ist. lembur ${k.ob1}–${k.ob2} dikurangi`;
  if(k.ok)msg+=')';
  $('inf').textContent=msg;
  if(k.w>0){$('ha').checked=true;$('na').checked=false;lvSel=null;showLv()}
}
/* picker jam buatan sendiri */
let tid=null;
['ch','cm'].forEach((id,i)=>{
  $(id).innerHTML=Array.from({length:i?60:24},(_,j)=>{const v=String(j).padStart(2,'0');return`<div data-v="${v}">${v}</div>`}).join('');
  $(id).onclick=e=>{const x=e.target.closest('[data-v]');if(x)mark(id,x.dataset.v,false)};
});
function mark(id,v,scroll){const c=$(id);c.querySelectorAll('div').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  const el=c.querySelector('.on');if(el&&scroll)c.scrollTop=el.offsetTop-c.clientHeight/2+el.offsetHeight/2}
function pick(id){tid=id;const[h,m]=(T[id]||'08:00').split(':');$('tp').showModal();mark('ch',h,true);mark('cm',m,true)}
['ti','to','sin','sout'].forEach(id=>$(id).onclick=()=>pick(id));
const afterT=()=>{$('tp').close();if(tid==='ti'||tid==='to')onT()};
$('tcl').onclick=()=>$('tp').close();
$('tclr').onclick=()=>{setT(tid,'');afterT()};
$('tok').onclick=()=>{const h=$('ch').querySelector('.on'),m=$('cm').querySelector('.on');
  setT(tid,(h?h.dataset.v:'00')+':'+(m?m.dataset.v:'00'));afterT()};

/* modal absen */
let sel=null;
let lvSel=null,dlc=false;
function showLv(){
  const notIn=$('na').checked;
  $('lvr').classList.toggle('hid',!notIn);
  $('tblock').classList.toggle('hid',notIn);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.t===lvSel));
}
$('cal').onclick=e=>{const b=e.target.closest('.d[data-d]');if(!b)return;
  sel=key(cur.getFullYear(),cur.getMonth(),+b.dataset.d);
  const[yy,mm,dd]=sel.split('-').map(Number),off=isOff(yy,mm-1,dd),lv=S.lv[sel];
  $('dt').textContent=new Date(sel+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  $('ha').checked=!!S.att[sel];lvSel=lv||null;$('na').checked=!!lv;
  const tm=S.tm[sel]||(lv?['','']:[S.dIn,S.dOut]);
  setT('ti',tm[0]);setT('to',tm[1]);onT();
  showLv();$('dl').textContent='Hapus data';dlc=false;$('ds').showModal()};
$('ha').onchange=()=>{if($('ha').checked){$('na').checked=false;lvSel=null;showLv();if(!T.ti)setT('ti',S.dIn);if(!T.to)setT('to',S.dOut);onT()}
  else{setT('ti','');setT('to','');$('inf').textContent=''}};
$('na').onchange=()=>{if($('na').checked){$('ha').checked=false;setT('ti','');setT('to','');$('inf').textContent=''}else{lvSel=null;}showLv()};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{lvSel=c.dataset.t;showLv();$('inf').textContent=''});
$('dc').onclick=()=>$('ds').close();
$('dsv').onclick=()=>{
  if($('na').checked){
    if(!lvSel){$('inf').textContent='Pilih Sakit / Izin / Cuti / Alpa';return}
    S.lv[sel]=lvSel;delete S.att[sel];delete S.tm[sel];delete S.ot[sel];
  }else{
    const k=wk();
    if(k&&!k.ok){$('inf').textContent='Jam pulang harus setelah jam masuk';return}
    delete S.lv[sel];
    if(k)S.tm[sel]=[T.ti,T.to];else delete S.tm[sel];
    if(k&&k.ot>0)S.ot[sel]=+k.ot.toFixed(2);else delete S.ot[sel];
    if($('ha').checked||(k&&k.w>0))S.att[sel]=1;else delete S.att[sel];
  }
  save();$('ds').close();render()};
$('dl').onclick=()=>{
  if(!dlc){dlc=true;$('dl').textContent='Yakin hapus? Ketuk lagi';return}
  [S.att,S.tm,S.ot,S.lv].forEach(o=>delete o[sel]);save();$('ds').close();render()};

/* modal detail */
$('det').onclick=()=>{
  const c=calc();
  const y=c.y,m=c.m;
  $('dtl-ttl').textContent='Detail Kehadiran – '+cur.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const DN2=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  let rows='',totalKerja=0,totalLembur=0,totalNominal=0,runTotal=0;
  for(let d=1;d<=c.n;d++){
    const k=key(y,m,d),off=isOff(y,m,d),dt=new Date(y,m,d);
    const hari=DN2[dt.getDay()];
    const tm=S.tm[k];
    let masuk='-',pulang='-',jamKerja=0,jamLembur=0,nominal=0,otPay=0,status='',styCls='';
    if(S.att[k]){
      status='Hadir';styCls='color:var(--had-tx)';
      if(tm){masuk=tm[0]||'-';pulang=tm[1]||'-';}
      const otH=+S.ot[k]||0;
      if(tm&&tm[0]&&tm[1]){
        const a=mn(tm[0]),b=mn(tm[1]);
        const day=dt.getDay(),brk=S.brk[day]||S.brk[1];
        const bs=mn(brk[0]),be=mn(brk[1]);
        jamKerja=+(Math.max(0,(b-a-Math.max(0,Math.min(b,be)-Math.max(a,bs)))/60)).toFixed(2);
        // istirahat lembur
        const brkOt=S.brkOt[day]||['',''];
        let otBrk=0;
        if(brkOt[0]&&brkOt[1]){const obs=mn(brkOt[0]),obe=mn(brkOt[1]);otBrk=Math.max(0,Math.min(b,obe)-Math.max(a+S.hours*60,obs))/60;}
        jamLembur=+Math.max(0,jamKerja-S.hours-otBrk).toFixed(2);
      }
      otPay=otH*c.otHour;nominal=c.perDay+otPay;
    }else if(S.lv[k]){
      status=LB[S.lv[k]];
      if(S.lv[k]==='alpa')styCls='color:var(--alp-tx)';
      else styCls='color:var(--lv-tx2)';
      if(S.paid[S.lv[k]])nominal=c.perDay;
    }else if(off){
      status=S.holMap&&S.holMap[k]?S.holMap[k]:'Libur';styCls='color:var(--mu)';
    }else{
      status='—';styCls='color:var(--mu)';
    }
    totalKerja+=jamKerja;totalLembur+=jamLembur;totalNominal+=nominal;runTotal+=nominal;
    rows+=`<tr>
      <td>${String(d).padStart(2,'0')} ${hari}</td>
      <td style="${styCls}">${status}</td>
      <td class="ct">${masuk}</td>
      <td class="ct">${pulang}</td>
      <td class="ct">${jamKerja?+jamKerja.toFixed(1)+'j':'-'}</td>
      <td class="ct">${jamLembur?+jamLembur.toFixed(1)+'j':'-'}</td>
      <td class="rp">${nominal?(otPay?rp(c.perDay)+' + '+rp(otPay):rp(nominal)):'-'}</td>
      <td class="rp" style="color:var(--ok)">${nominal&&S.att[k]?rp(runTotal):'-'}</td>
    </tr>`;
  }
  $('dtl-body').innerHTML=rows;
  $('dtl-sum').innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px">
    <span style="color:var(--mu)">Total kerja <b style="color:var(--tx)">${+totalKerja.toFixed(1)} jam</b></span>
    <span style="color:var(--mu)">Lembur <b style="color:var(--ot)">${+totalLembur.toFixed(1)} jam</b></span>
    <span style="color:var(--mu)">Gaji sementara <b style="color:var(--ok)">${rp(c.pd*c.perDay+c.otPay)}</b></span>
  </div>`;
  $('dtl').showModal();
};
$('dtl-c').onclick=()=>$('dtl').close();

/* modal hari libur nasional */
let hlEditKey=null;
function renderHolList(){
  const y=cur.getFullYear(),m=String(cur.getMonth()+1).padStart(2,'0');
  const prefix=`${y}-${m}`;
  const entries=Object.entries(S.holMap).filter(([k])=>k.startsWith(prefix)).sort((a,b)=>a[0].localeCompare(b[0]));
  if(!entries.length){$('hl-list').innerHTML='<p style="color:var(--mu);font-size:13px;text-align:center;padding:16px">Belum ada hari libur bulan ini</p>';return;}
  $('hl-list').innerHTML=entries.map(([k,n])=>{
    const dt=new Date(k+'T00:00');
    const label=dt.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
    const isEditing=k===hlEditKey;
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--ln);gap:8px;${isEditing?'background:var(--edt);border-radius:6px;padding:8px;':''}">
      <div style="min-width:0">
        <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n}</div>
        <div style="font-size:11px;color:var(--mu)">${label}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button data-ek="${k}" data-en="${n}" style="padding:4px 10px;font-size:12px">Edit</button>
        <button data-hk="${k}" style="padding:4px 10px;color:var(--err-tx);border-color:var(--err-bd);font-size:12px">Hapus</button>
      </div>
    </div>`;
  }).join('');
  $('hl-list').querySelectorAll('[data-hk]').forEach(b=>b.onclick=()=>{
    if(hlEditKey===b.dataset.hk){hlEditKey=null;$('hl-dt').value='';$('hl-nm').value='';$('hl-add').textContent='+ Tambah';}
    delete S.holMap[b.dataset.hk];save();renderHolList();render();
  });
  $('hl-list').querySelectorAll('[data-ek]').forEach(b=>b.onclick=()=>{
    hlEditKey=b.dataset.ek;
    $('hl-dt').value=b.dataset.ek;
    $('hl-nm').value=b.dataset.en;
    $('hl-add').textContent='✓ Update';
    renderHolList();
  });
}
$('ahl').onclick=()=>{
  hlEditKey=null;
  const y=cur.getFullYear(),m=String(cur.getMonth()+1).padStart(2,'0');
  $('hl-dt').value=`${y}-${m}-01`;
  $('hl-dt').min=`${y}-${m}-01`;
  $('hl-dt').max=`${y}-${m}-${new Date(y,cur.getMonth()+1,0).getDate()}`;
  $('hl-nm').value='';
  $('hl-add').textContent='+ Tambah';
  $('hl-ttl').textContent='🗓️ Libur – '+cur.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  renderHolList();$('hl').showModal();
};
$('hl-add').onclick=()=>{
  const d=$('hl-dt').value,n=$('hl-nm').value.trim();
  if(!d){$('hl-nm').placeholder='Pilih tanggal dulu';return;}
  if(hlEditKey&&hlEditKey!==d){delete S.holMap[hlEditKey];}
  S.holMap[d]=n||'Libur Nasional';
  hlEditKey=null;
  $('hl-add').textContent='+ Tambah';
  save();renderHolList();render();
  $('hl-nm').value='';
};
$('hl-c').onclick=()=>{hlEditKey=null;$('hl').close()};
$('hl-dt').onclick=()=>{try{$('hl-dt').showPicker();}catch(e){}};
$('set').onclick=()=>{$('sal').value=S.salary;$('hrs').value=S.hours;$('mul').value=S.mult;
  setT('sin',S.dIn);setT('sout',S.dOut);
  [0,1,2,3,4,5,6].forEach(d=>$('wd_'+d).checked=S.wdays.includes(d));
  ['sakit','izin','cuti'].forEach(k=>$('pd_'+k).checked=!!S.paid[k]);$('st').showModal()};
$('sc').onclick=()=>$('st').close();
$('ssv').onclick=()=>{S.salary=+$('sal').value||S.salary;S.hours=+$('hrs').value||S.hours;S.mult=+$('mul').value||S.mult;
  S.dIn=T.sin||S.dIn;S.dOut=T.sout||S.dOut;
  S.wdays=[0,1,2,3,4,5,6].filter(d=>$('wd_'+d).checked);
  if(!S.wdays.length)S.wdays=[1,2,3,4,5];
  ['sakit','izin','cuti'].forEach(k=>S.paid[k]=$('pd_'+k).checked);
  save();$('st').close();render()};
const DN=['','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],DD=[1,2,3,4,5,6];
$('brl').innerHTML=DD.map(d=>`<div class="brow"><span>${DN[d]}</span><button class="tb" id="bs${d}"></button><button class="tb" id="be${d}"></button></div>`).join('');
$('brlo').innerHTML=DD.map(d=>`<div class="brow"><span>${DN[d]}</span><button class="tb" id="bos${d}"></button><button class="tb" id="boe${d}"></button></div>`).join('');
DD.forEach(d=>{
  T['bs'+d]='';T['be'+d]='';$('bs'+d).onclick=()=>pick('bs'+d);$('be'+d).onclick=()=>pick('be'+d);
  T['bos'+d]='';T['boe'+d]='';$('bos'+d).onclick=()=>pick('bos'+d);$('boe'+d).onclick=()=>pick('boe'+d);
});
$('abr').onclick=()=>{
  DD.forEach(d=>{
    setT('bs'+d,S.brk[d][0]);setT('be'+d,S.brk[d][1]);
    setT('bos'+d,S.brkOt[d][0]||'');setT('boe'+d,S.brkOt[d][1]||'');
  });
  $('br').showModal();
};
$('brc').onclick=()=>$('br').close();
$('brs').onclick=()=>{
  DD.forEach(d=>{
    const a=T['bs'+d],b=T['be'+d];if(a&&b&&mn(a)<mn(b))S.brk[d]=[a,b];
    const oa=T['bos'+d],ob=T['boe'+d];
    S.brkOt[d]=(oa&&ob&&mn(oa)<mn(ob))?[oa,ob]:['',''];
  });
  save();$('br').close();
};
$('prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$('next').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};

/* ── AUTH ── */
function showApp(){$('tgl-auth').classList.add('hid');$('auth-wrap').classList.add('hid');$('app').classList.remove('hid');render();}
function showAuth(){$('tgl-auth').classList.remove('hid');$('auth-wrap').classList.remove('hid');$('app').classList.add('hid');}

async function loadFromSupabase(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user)return;
  const{data,error}=await sb.from('gaji_state').select('data').eq('user_id',user.id).single();
  if(data&&data.data){
    applyState(data.data);
    try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  }
  showApp();
}

$('auth-login').onclick=async()=>{
  const email=$('auth-email').value.trim(),pass=$('auth-pass').value;
  if(!email||!pass){$('auth-err').textContent='Isi email dan password';return;}
  $('auth-login').disabled=true;$('auth-login').textContent='Memproses...';
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  $('auth-login').disabled=false;$('auth-login').textContent='Masuk';
  if(error){$('auth-err').textContent=error.message;return;}
  $('auth-err').textContent='';
  await loadFromSupabase();
};

$('auth-reg').onclick=async()=>{
  const email=$('auth-email').value.trim(),pass=$('auth-pass').value;
  if(!email||!pass){$('auth-err').textContent='Isi email dan password';return;}
  if(pass.length<6){$('auth-err').textContent='Password minimal 6 karakter';return;}
  $('auth-reg').disabled=true;$('auth-reg').textContent='Memproses...';
  const{error}=await sb.auth.signUp({email,password:pass});
  $('auth-reg').disabled=false;$('auth-reg').textContent='Daftar';
  if(error){$('auth-err').textContent=error.message;return;}
  $('auth-err').textContent='';
  $('auth-sub').textContent='Cek email kamu untuk konfirmasi, lalu login.';
};

$('auth-forgot').onclick=async(e)=>{
  e.preventDefault();
  const email=$('auth-email').value.trim();
  if(!email){$('auth-err').textContent='Isi email dulu';return;}
  await sb.auth.resetPasswordForEmail(email);
  $('auth-err').style.color='var(--ok)';$('auth-err').textContent='Link reset dikirim ke email kamu';
};

$('logout').onclick=async()=>{
  await sb.auth.signOut();
  showAuth();
};

// cek session aktif saat load
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){await loadFromSupabase();}
  else showAuth();
})();

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));
