<!DOCTYPE html>
<html><head><title>Generate Icons</title></head><body>
<p>Klik tombol untuk generate dan download icon PWA.</p>
<button onclick="gen(192)">Download icon-192.png</button>
<button onclick="gen(512)">Download icon-512.png</button>
<canvas id="c" style="display:none"></canvas>
<script>
function gen(size){
  const c=document.getElementById('c');
  c.width=c.height=size;
  const ctx=c.getContext('2d');
  // background
  ctx.fillStyle='#0f172a';
  const r=size*0.188;
  ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.fill();
  // emoji
  ctx.font=`${size*0.6}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('💰',size/2,size/2+size*0.04);
  // download
  const a=document.createElement('a');
  a.download=`icon-${size}.png`;
  a.href=c.toDataURL('image/png');
  a.click();
}
</script>
</body></html>
